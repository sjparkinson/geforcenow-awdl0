name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      # Only the resolved dependency checkouts are cached. Build products are
      # deliberately left out: the runner image moves between Xcode releases,
      # and a stale .build from another toolchain fails to link.
      - name: Cache Swift dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Upload
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: .build/release/geforcenow-awdl0
          archive: false

      - name: Attest
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .build/release/geforcenow-awdl0

  format:
    name: Format
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # swift-format ships with the toolchain. Reformatting in place and asking
      # git whether anything moved means a failure prints the exact diff to
      # apply, rather than a list of line numbers.
      - name: Check formatting
        run: |
          swift format --recursive --in-place Package.swift Sources Tests
          git diff --exit-code
